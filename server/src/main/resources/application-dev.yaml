spring:
  config:
    activate:
      on-profile: dev
  datasource:
    hikari:
      maximum-pool-size: 80
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1740000
      keepalive-time: 1500000
      initialization-fail-timeout: 0
      validation-timeout: 5000
      connection-test-query: SELECT 1
      leakDetectionThreshold: 30000
  cloud:
    gcp:
      pubsub:
        enabled: true