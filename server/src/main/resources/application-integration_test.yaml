spring:
  config:
    activate:
      on-profile: integration_test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    # Show sql when spring data jpa performs query
    show-sql: false
  datasource:
    url: jdbc:h2:mem:integration_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
  cloud:
    gcp:
      pubsub:
        enabled: false
aes:
  secretKey: 1234567890123456

auth:
  singleUser:
    enabled: true
  google:
    enabled: false
  jwt:
    signingKey: arbitrarilyLongArrayAsKeyarbitrarilyLongArrayAsKeyarbitrarilyLongArrayAsKeyarbitrarilyLongArr
    validity: 7200
  tos:
    signingKey: arbitrarilyVeryLongArrayAsKeyarbitrarilyVeryLongArrayAsKeyarbitrarilyVeryLongArrayAsKeythanks
    validity: 1800
    type: df # tt or df
  allowlist:
    group_ids: abcd1234
    domains: # null

user:
  firstName: integ
  lastName: test
  email: integ_test@google.com

feature-gate:
  redis-enabled: false