databaseChangeLog:
  - changeSet:
      id: v2-seed-system-user
      author: stax
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT COUNT(*) FROM user"
      changes:
        - insert:
            tableName: user
            columns:
              - column:
                  name: id
                  value: user-e040fe2f-ae45-11f0-93fc-0242ac110002
              - column:
                  name: first_name
                  value: System
              - column:
                  name: last_name
                  value: User
              - column:
                  name: email
                  value: "${adminUserMail}"
              - column:
                  name: role
                  value: SYSTEM
              - column:
                  name: is_enabled
                  valueBoolean: false
              - column:
                  name: created_at
                  valueDate: NOW()
              - column:
                  name: updated_at
                  valueDate: NOW()
              - column:
                  name: status
                  value: ACTIVE
