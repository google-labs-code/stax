version: '3.8'

services:
  db:
    image: mysql:8.4.7
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${JDBC_DATABASE_PASSWORD}
      MYSQL_DATABASE: stax
    ports:
      - "3307:3306"
    volumes:
      - stax-data:/var/lib/mysql
    networks:
      - stax-network
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-u", "${JDBC_DATABASE_USERNAME}", "-p${JDBC_DATABASE_PASSWORD}", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - stax-network
    profiles:
      - "redis"

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    container_name: pubsub-emulator
    restart: unless-stopped
    command: >
      /bin/sh -c "gcloud beta emulators pubsub start 
      --project=${GCP_PROJECT_ID} 
      --host-port=0.0.0.0:8085"
    ports:
      - "8085:8085"
    networks:
      - stax-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: spring-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pubsub-emulator:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - stax-network
    environment:
      JDBC_DATABASE_URL: jdbc:mysql://db:3306/stax?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      REDIS_URL: redis
      REDIS_PORT: 6379
      SPRING_CLOUD_GCP_PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      SPRING_CLOUD_GCP_PUBSUB_ENABLED: "true"

      AES_SECRET_KEY: ${AES_SECRET_KEY}
      APP_ENV: ${APP_ENV}
      AUTH_ALLOWLIST_DOMAINS: ${AUTH_ALLOWLIST_DOMAINS}
      AUTH_ALLOWLIST_GROUP_IDS: ${AUTH_ALLOWLIST_GROUP_IDS}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      JDBC_DATABASE_PASSWORD: ${JDBC_DATABASE_PASSWORD}
      JDBC_DATABASE_USERNAME: ${JDBC_DATABASE_USERNAME}
      TOS_TYPE: ${TOS_TYPE}

      SPRING_PROFILES_ACTIVE: ${PROFILE_ACTIVE}
      TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY}
      TOS_TOKEN_SIGNING_KEY: ${TOS_TOKEN_SIGNING_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      SPRING_LIQUIBASE_DROP_FIRST: ${SPRING_LIQUIBASE_DROP_FIRST}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL}
      SPRING_WEB_CORS_ALLOWED_ORIGINS: ${SPRING_WEB_CORS_ALLOWED_ORIGINS}
      SPRING_WEB_CORS_ALLOWED_METHODS: ${SPRING_WEB_CORS_ALLOWED_METHODS}
      SPRING_APPLICATION_LIMITS_MAXIMUM_DATA_SETS: ${SPRING_APPLICATION_LIMITS_MAXIMUM_DATA_SETS}
      FEATURE_GATE_REDIS_ENABLED: ${FEATURE_GATE_REDIS_ENABLED}

      USER_FIRSTNAME: ${USER_FIRSTNAME}
      USER_LASTNAME: ${USER_LASTNAME}
      USER_EMAIL: ${USER_EMAIL}

      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY}

networks:
  stax-network:
    driver: bridge

volumes:
  stax-data:
    driver: local